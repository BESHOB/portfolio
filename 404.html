    <!-- ========================================================= -->
    <!-- SPA Meta Tag Updater -->
    <!-- ========================================================= -->

    <script>
      window.updateMetaTags = function (config) {
        /*
         * Update or create a <meta> tag.
         *
         * For Open Graph:
         *   updateMeta("og:title", "...", true)
         *
         * For normal meta tags:
         *   updateMeta("description", "...", false)
         */

        const updateMeta = (
          name,
          content,
          isProperty = true
        ) => {
          if (!content) return;

          let element = document.querySelector(
            isProperty
              ? `meta[property="${name}"]`
              : `meta[name="${name}"]`
          );

          if (!element) {
            element = document.createElement("meta");

            if (isProperty) {
              element.setAttribute("property", name);
            } else {
              element.setAttribute("name", name);
            }

            document.head.appendChild(element);
          }

          element.setAttribute("content", content);
        };

        /*
         * Update canonical URL.
         *
         * Canonical is a <link>, NOT a <meta>.
         */
        const updateCanonical = (url) => {
          if (!url) return;

          let canonical = document.querySelector(
            'link[rel="canonical"]'
          );

          if (!canonical) {
            canonical = document.createElement("link");
            canonical.setAttribute("rel", "canonical");
            document.head.appendChild(canonical);
          }

          canonical.setAttribute("href", url);
        };

        /*
         * =========================================================
         * Basic SEO
         * =========================================================
         */

        if (config.title) {
          updateMeta(
            "title",
            config.title,
            false
          );
        }

        if (config.description) {
          updateMeta(
            "description",
            config.description,
            false
          );
        }

        if (config.keywords) {
          updateMeta(
            "keywords",
            config.keywords,
            false
          );
        }

        if (config.canonical) {
          updateCanonical(config.canonical);
        }

        /*
         * =========================================================
         * Open Graph
         * =========================================================
         */

        if (config.og_title) {
          updateMeta(
            "og:title",
            config.og_title,
            true
          );
        }

        if (config.og_description) {
          updateMeta(
            "og:description",
            config.og_description,
            true
          );
        }

        if (config.og_image) {
          updateMeta(
            "og:image",
            config.og_image,
            true
          );

          updateMeta(
            "og:image:secure_url",
            config.og_image,
            true
          );
        }

        if (config.og_image_width) {
          updateMeta(
            "og:image:width",
            config.og_image_width,
            true
          );
        }

        if (config.og_image_height) {
          updateMeta(
            "og:image:height",
            config.og_image_height,
            true
          );
        }

        if (config.og_image_type) {
          updateMeta(
            "og:image:type",
            config.og_image_type,
            true
          );
        }

        if (config.og_image_alt) {
          updateMeta(
            "og:image:alt",
            config.og_image_alt,
            true
          );
        }

        if (config.og_url) {
          updateMeta(
            "og:url",
            config.og_url,
            true
          );
        }

        if (config.og_type) {
          updateMeta(
            "og:type",
            config.og_type,
            true
          );
        }

        if (config.og_site_name) {
          updateMeta(
            "og:site_name",
            config.og_site_name,
            true
          );
        }

        /*
         * =========================================================
         * X / Twitter
         * =========================================================
         */

        if (config.twitter_title) {
          updateMeta(
            "twitter:title",
            config.twitter_title,
            false
          );
        }

        if (config.twitter_description) {
          updateMeta(
            "twitter:description",
            config.twitter_description,
            false
          );
        }

        if (config.twitter_image) {
          updateMeta(
            "twitter:image",
            config.twitter_image,
            false
          );
        }

        if (config.twitter_image_alt) {
          updateMeta(
            "twitter:image:alt",
            config.twitter_image_alt,
            false
          );
        }

        if (config.twitter_url) {
          updateMeta(
            "twitter:url",
            config.twitter_url,
            false
          );
        }

        if (config.twitter_card) {
          updateMeta(
            "twitter:card",
            config.twitter_card,
            false
          );
        }

        /*
         * =========================================================
         * Browser title
         * =========================================================
         */

        if (config.page_title) {
          document.title = config.page_title;
        }

        /*
         * =========================================================
         * Schema.org JSON-LD
         * =========================================================
         */

        if (config.schema) {
          let schemaScript =
            document.querySelector(
              'script[type="application/ld+json"]#person-schema'
            );

          if (!schemaScript) {
            schemaScript = document.createElement("script");
            schemaScript.type =
              "application/ld+json";
            schemaScript.id = "person-schema";

            document.head.appendChild(
              schemaScript
            );
          }

          schemaScript.textContent =
            JSON.stringify(config.schema);
        }
      };

      /*
       * =========================================================
       * Reset to Homepage Metadata

      window.resetMetaTags = function () {
        const defaultTitle =
          "Walid Belmahi - Creative Developer & Graphic Designer";

        const defaultImage =

        const defaultUrl =

        window.updateMetaTags({
          page_title: defaultTitle,

          title: defaultTitle,

          description: defaultDescription,

          canonical: defaultUrl,

          /*

          og_title: defaultTitle,

          og_description: defaultDescription,

          og_image_width: "1200",

          og_url: defaultUrl,

          og_type: "website",

          og_site_name:
            "Walid Belmahi Portfolio",

          /*

           */
          twitter_title: defaultTitle,

          twitter_description:
            defaultDescription,

          twitter_image: defaultImage,

          twitter_image_alt:
            "Walid Belmahi - Creative Developer and Graphic Designer",

          twitter_url: defaultUrl,

          twitter_card:
            "summary_large_image"
        });
      };
    </script>
